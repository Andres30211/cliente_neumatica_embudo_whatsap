<aside class="sidebar">

  <!-- LOGO -->
  <div class="sidebar__brand">
    <div class="sidebar__logo">
      <img src="ico.png" alt="Neumática Industrial S.A.S.">
    </div>
  </div>


  <!-- MENÚ -->
  <nav class="sidebar__nav">

    <!-- TABLERO -->
    <a [routerLink]="['/home']" routerLinkActive="sidebar__item--active" class="sidebar__item">
      <span class="sidebar__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="4" width="6" height="6" rx="1"></rect>
          <rect x="14" y="4" width="6" height="6" rx="1"></rect>
          <rect x="4" y="14" width="6" height="6" rx="1"></rect>
          <rect x="14" y="14" width="6" height="6" rx="1"></rect>
        </svg>
      </span>

      <span class="sidebar__text">
        Tablero
      </span>
    </a>


    <!-- EMBUDO -->
    @if (!this.meRol('ROLE_USER')) {

    <a [routerLink]="['/whatsapp-embudo']" routerLinkActive="sidebar__item--active" class="sidebar__item">
      <span class="sidebar__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16l-6.2 7v5.5l-3.6 1.8V12L4 5z"></path>
        </svg>
      </span>

      <span class="sidebar__text">
        Embudo
      </span>
    </a>

    }

    <!-- ASISTENCIA -->
    @if (this.meRol('ROLE_ADMIN') || this.meRol('ROLE_VENDEDOR')) {

    <a [routerLink]="['/visit']" routerLinkActive="sidebar__item--active" class="sidebar__item">
      <span class="sidebar__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="2"></rect>
          <path d="M8 3v4"></path>
          <path d="M16 3v4"></path>
          <path d="M4 10h16"></path>
          <path d="m8 15 2 2 5-5"></path>
        </svg>
      </span>

      <span class="sidebar__text">
        Visitas
      </span>
    </a>

    }

     <!-- CENTRO DE CONTROL -->
    @if (this.meRol('ROLE_ADMIN') || this.meRol('ROLE_PUBLICISTA')) {

    <a [routerLink]="['/centro-control']" routerLinkActive="sidebar__item--active" class="sidebar__item">
      <span class="sidebar__icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16"></path>
          <circle cx="9" cy="6" r="2"></circle>

          <path d="M4 12h16"></path>
          <circle cx="15" cy="12" r="2"></circle>

          <path d="M4 18h16"></path>
          <circle cx="11" cy="18" r="2"></circle>
        </svg>
      </span>

      <span class="sidebar__text">
        C. de Control
      </span>
    </a>

    }

  </nav>


  <!-- PARTE INFERIOR -->
  <div class="sidebar__footer">

    <div class="sidebar__footer-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 3a9 9 0 1 0 9 9"></path>
        <path d="M12 7v5l3 2"></path>
        <path d="M16 3h5v5"></path>
        <path d="m21 3-5 5"></path>
      </svg>
    </div>

    <div class="sidebar__footer-text">
      <strong>Neumática</strong>
      <span>Industrial S.A.S.</span>
    </div>

  </div>

</aside>
