<header class="topbar">

  <!-- =====================================================
       BIENVENIDA
       ===================================================== -->

  <div class="topbar__welcome">

    <h1>
      ¡Bienvenido, {{ nombre }}! <span>👋</span>
    </h1>

    <p>
      Aquí tienes el resumen general de tu CRM.
    </p>

  </div>


  <!-- =====================================================
       ACCIONES DEL TOPBAR
       ===================================================== -->

  <div class="topbar__actions">

    <!-- ===================================================
        USUARIO
    =================================================== -->

    <div class="topbar__user">


      <!-- AVATAR -->

      <button type="button" class="topbar__avatar" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto"
        aria-label="Abrir menú de usuario">

        {{ obtenerIniciales(nombre) }}

      </button>


      <!-- NOMBRE -->

      <span class="topbar__username">
        {{ nombre }}
      </span>


      <!-- FLECHA / MENÚ -->

      <div class="topbar__menu">


        <button type="button" class="topbar__arrow" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto"
          aria-label="Abrir menú de usuario">

          <svg viewBox="0 0 24 24" aria-hidden="true">

            <path d="M6 9l6 6 6-6"></path>

          </svg>

        </button>


        <!-- ===============================================
             MENÚ DE USUARIO
             =============================================== -->

        @if (menuAbierto) {

        <div class="topbar__dropdown">


          <div class="topbar__dropdown-user">

            <div class="topbar__dropdown-avatar">

              {{ obtenerIniciales(nombre) }}

            </div>


            <div>

              <strong>
                {{ nombre }}
              </strong>

              <span>
                Usuario del CRM
              </span>

            </div>

          </div>


          <div class="topbar__dropdown-divider"></div>


          <button type="button" class="topbar__logout" (click)="cerrarSesion()">

            <span class="topbar__logout-icon">

              <svg viewBox="0 0 24 24" aria-hidden="true">

                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>

                <path d="M16 17l5-5-5-5"></path>

                <path d="M21 12H9"></path>

              </svg>

            </span>

            <span>
              Cerrar sesión
            </span>

          </button>

          <button type="button"
          class="topbar__notification"
          (click)="activarNotificaciones()">
            activar
          </button>

        </div>

        }

      </div>

    </div>

  </div>

</header>
